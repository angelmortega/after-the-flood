[project]
name = "after-the-flood"
version = "0.1.0"
description = "Deep research on floods and recovery: a lead fans out hazard, insurance and market researchers over NOAA, FEMA, NFIP and Zillow data, then a writer turns their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.5.6",
]
